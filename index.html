<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/main.js" defer></script>
    <link rel="stylesheet" href="./css/styles.css">
    <title>Mi simulador - Tienda</title>
</head>
<body>
    <h1>Mi Simulador de Tienda</h1>

    <div class="formulario">
        <input type="text" id="inputNombre" placeholder="Nombre del producto" />
        <input type="number" id="inputPrecio" placeholder="Precio" />
        <button id="btnAgregar">+ Agregar</button>
    </div>

    <div class="acciones">
        <input type="text" id="inputBuscar" placeholder="Buscar producto..." />
        <button id="btnVaciar">Vaciar todo</button>
    </div>

    <p id="mensaje"></p>

    <div id="contenedorItems"></div>
</body>
</html>
